<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Barnyard</title>
<style>
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
#game { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
#status { position: absolute; left: 8px; bottom: 8px; color: #ccc; font: 13px monospace; pointer-events: none; }
#log { position: absolute; left: 0; top: 0; right: 0; max-height: 60%; overflow: hidden; z-index: 10; padding: 4px; background: rgba(0,0,0,0.6); color: #cfc; font: 9px monospace; pointer-events: none; word-break: break-all; }
#fps { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); z-index: 5; padding: 1px 6px; border-radius: 4px; background: rgba(0,0,0,0.45); color: #fff; font: bold 13px monospace; pointer-events: none; }
#touch { position: absolute; inset: 0; }
#touch .button { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.18); border: 2px solid rgba(255,255,255,0.45); color: rgba(255,255,255,0.8); text-align: center; font-family: sans-serif; font-weight: bold; box-sizing: border-box; }
#touch .button.down { background: rgba(255,255,255,0.45); }
#touch .stick { display: none; position: absolute; width: 30vmin; height: 30vmin; margin: -15vmin 0 0 -15vmin; border-radius: 50%; border: 2px solid rgba(255,255,255,0.35); box-sizing: border-box; pointer-events: none; }
#touch .knob { position: absolute; left: 25%; top: 25%; width: 50%; height: 50%; border-radius: 50%; background: rgba(255,255,255,0.35); }
#settingsButton { position: absolute; left: 1.5vmin; top: 1.5vmin; width: 7vmin; height: 7vmin; max-width: 40px; max-height: 40px; z-index: 20; color: rgba(255,255,255,0.7); cursor: pointer; }
#settings { display: none; position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 21; min-width: 260px; max-height: 90%; overflow-y: auto; padding: 12px 16px; border-radius: 8px; background: rgba(20,20,20,0.92); color: #eee; font: 15px sans-serif; user-select: auto; -webkit-user-select: auto; }
#settings .title { font-weight: bold; font-size: 17px; margin-bottom: 8px; }
#settings label { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 8px 0; }
#settings select, #settings input[type=text] { font: 15px sans-serif; padding: 3px; }
#settings input[type=text] { width: 150px; text-transform: uppercase; }
#settings input[type=checkbox] { width: 20px; height: 20px; }
#settings .hint { color: #aaa; font-size: 12px; margin: 4px 0; }
#settings .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
#settings button { font: 15px sans-serif; padding: 5px 12px; }
#rotate { display: none; position: absolute; inset: 0; background: #000; color: #fff; font: 20px sans-serif; align-items: center; justify-content: center; text-align: center; }
@media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="status">Loading...</div>
<div id="rotate">Please turn your device sideways</div>
<script>
// Shared memory only exists on https (or localhost) pages
if ( !window.isSecureContext )
{
	document.getElementById( "status" ).textContent = "The game needs the https:// address of this page";
}
// Without the headers threads need, get them from the service worker and load again
else if (!window.crossOriginIsolated && navigator.serviceWorker && location.search.indexOf( "nosw" ) < 0 )
{
	navigator.serviceWorker.register( "sw.js" ).then( function () {
		return navigator.serviceWorker.ready;
	} ).then( function () {
		if ( !sessionStorage.getItem( "bReloaded" ) )
		{
			sessionStorage.setItem( "bReloaded", "1" );
			location.reload();
		}
		else
		{
			document.getElementById( "status" ).textContent = "This browser can't isolate the page, the game can't run here";
		}
	} );
}
</script>
<script src="gl_replay.js"></script>
<script src="input.js"></script>
<script src="settings.js"></script>
<script src="page.js"></script>
<script src="OpenBarnyard.js"></script>
</body>
</html>
